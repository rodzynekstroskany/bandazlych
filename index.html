.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
h2{font:400 26px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
h3{font:600 13px/1.2 var(--f-label);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--red-ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* tab bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,11,12,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0 calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:0 max(16px,env(safe-area-inset-left,0px))}
.bar .wrap{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none}
.bar .wrap::-webkit-scrollbar{display:none}
.brand{font:400 20px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;padding:14px 14px 14px 0;white-space:nowrap}
.brand b{color:var(--red);font-weight:400}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:14px 12px 11px;font:600 15px/1 var(--f-label);
  text-transform:uppercase;letter-spacing:.1em;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.tab img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.tab .sw{width:8px;height:8px;border-radius:50%}
.sep{width:1px;height:20px;background:var(--line);margin:0 6px;flex:none}

main{padding-top:28px;display:flex;flex-direction:column;gap:36px}
section.view{display:flex;flex-direction:column;gap:36px}
.sec{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px}

/* hero */
.hero{display:grid;grid-template-columns:132px 1fr;gap:24px;align-items:center}
.poster{width:132px;aspect-ratio:1415/2000;object-fit:cover;border-radius:2px;border:1px solid var(--line);display:block}
.hero h1{font:400 clamp(40px,8vw,76px)/.95 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.hero h1 span{color:var(--red)}
.hero p{margin:10px 0 0;color:var(--muted);max-width:56ch}
.kpis{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:18px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font:400 34px/1 var(--f-display);letter-spacing:.01em}
.kpi span{font:600 12px/1.2 var(--f-label);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}

/* people cards */
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.pcard{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);background:var(--surface);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px;text-align:left;min-width:0;border-radius:4px}
.pcard:hover{border-color:var(--muted)}
.pcard .top{display:flex;gap:14px;align-items:center}
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--c);flex:none}
.pname{font:400 26px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.psub{font:600 12px/1.3 var(--f-label);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini div{display:flex;flex-direction:column;gap:2px}
.mini b{font:400 26px/1 var(--f-display)}
.mini span{font:600 11px/1.2 var(--f-label);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.p{--c:var(--p)} .k{--c:var(--k)} .d{--c:var(--d)}

/* panels */
.panel{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;min-width:0}
.scroll{overflow-x:auto;padding-bottom:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font:600 13px/1 var(--f-label);text-transform:uppercase;letter-spacing:.1em}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--c)}
svg text{font-family:var(--f-label);fill:var(--muted);font-size:11px;letter-spacing:.06em}
.hm-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.hm-row:last-child{margin-bottom:0}
.hm-name{font:600 13px/1 var(--f-label);text-transform:uppercase;letter-spacing:.12em;display:flex;gap:8px;align-items:center}
.hm-name i{width:10px;height:10px;border-radius:2px;background:var(--c)}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.key span{display:inline-flex;gap:6px;align-items:center}
.key i{width:11px;height:11px;border-radius:2px;display:inline-block}

/* disciplines */
.disc{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:104px 1fr 34px;gap:10px;align-items:center;font:600 13px/1 var(--f-label);text-transform:uppercase;letter-spacing:.1em}
.dbar{height:10px;background:var(--surface2);border-radius:2px;overflow:hidden}
.dbar i{display:block;height:100%;background:var(--c);border-radius:0 2px 2px 0;min-width:2px}
.drow b{text-align:right;font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}

/* agenda */
.agenda{display:flex;flex-direction:column}
.arow{display:grid;grid-template-columns:78px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.arow:first-child{border-top:0;padding-top:0}
.adate{font:400 22px/1 var(--f-display);text-transform:uppercase}
.adate small{display:block;font:600 11px/1.3 var(--f-label);letter-spacing:.12em;color:var(--muted);margin-top:3px}
.aitems{display:flex;flex-direction:column;gap:6px;min-width:0}
.aline{display:flex;gap:8px;align-items:baseline;min-width:0}
.aline .dot{flex:none;transform:translateY(1px)}
.aline span{min-width:0;overflow-wrap:anywhere}
.aline em{font-style:normal;color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
.badge{flex:none;font:600 11px/1 var(--f-label);text-transform:uppercase;letter-spacing:.1em;padding:3px 6px;border-radius:2px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.ev{border-color:var(--red);color:var(--red-ink)}
.badge.buddy{border-color:var(--good);color:var(--good)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid var(--c);background:transparent}
.dot.on{background:var(--c)}

/* results */
.res{display:flex;flex-direction:column}
.rev{display:grid;grid-template-columns:150px 1fr;gap:6px 18px;padding:14px 0;border-top:1px solid var(--line)}
.rev:first-child{border-top:0;padding-top:0}
.rev h4{margin:0;font:600 16px/1.25 var(--f-body)}
.rev .rd{font:600 12px/1.4 var(--f-label);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.rlist{display:flex;flex-direction:column;gap:5px;min-width:0}
.rline{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rline .nm{font:600 12px/1 var(--f-label);text-transform:uppercase;letter-spacing:.1em;color:var(--c);min-width:58px}
.chip{font:700 11px/1 var(--f-label);text-transform:uppercase;letter-spacing:.1em;padding:3px 6px;border-radius:2px;white-space:nowrap;border:1px solid transparent;color:#fff}
.chip.gold{background:rgba(212,160,44,.28);border-color:#d4a02c}
.chip.silver{background:rgba(197,199,204,.22);border-color:#c5c7cc}
.chip.title{background:rgba(255,255,255,.18);border-color:#fff}
.chip.pb{background:transparent;border-color:var(--good)}
.chip.white{background:transparent;border-color:var(--muted)}
.chip.yellow{background:rgba(227,179,65,.28);border-color:var(--warn)}
.chip.red{background:var(--crit);border-color:var(--crit)}
.rline>span:last-child{min-width:0;overflow-wrap:anywhere}
.stats{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline}
.hl{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.hl li{padding-left:14px;position:relative}
.hl li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;background:var(--c);border-radius:1px}

/* calendar */
.calhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.calhead h2{min-width:170px}
.nav{background:var(--surface);border:1px solid var(--line);width:38px;height:38px;border-radius:4px;display:grid;place-items:center;font-size:18px;line-height:1}
.nav:hover{border-color:var(--muted)}
.todaybtn{padding:0 14px;width:auto;font:600 13px/1 var(--f-label);text-transform:uppercase;letter-spacing:.1em}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.dow{background:var(--surface2);padding:8px 6px;font:600 12px/1 var(--f-label);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);text-align:center}
.cell{background:var(--surface);min-height:92px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;border:0;border-radius:0;min-width:0;position:relative}
.cell:hover{background:var(--surface2)}
.cell.out{opacity:.38}
.cell.sel{outline:2px solid var(--red);outline-offset:-2px;z-index:1}
.cell .dn{font:600 13px/1 var(--f-label);letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.cell.today .dn b{background:var(--red);color:#fff;padding:2px 5px;border-radius:2px}
.cell.ev .dn::after{content:"";width:7px;height:7px;background:var(--red);border-radius:1px;align-self:center}
.cl{display:flex;gap:5px;align-items:center;font:600 11px/1.2 var(--f-label);letter-spacing:.04em;min-width:0;white-space:nowrap}
.cl .dot{width:8px;height:8px;border-width:2px;flex:none}
.cl span{overflow:hidden;text-overflow:ellipsis}
.daypanel{display:flex;flex-direction:column;gap:14px}
.daypanel h3{font-size:14px;color:var(--ink)}
.dline{display:grid;grid-template-columns:90px 1fr;gap:8px 14px;padding-top:12px;border-top:1px solid var(--line);min-width:0}
.dline:first-of-type{border-top:0;padding-top:0}
.who{font:600 13px/1.2 var(--f-label);text-transform:uppercase;letter-spacing:.1em;color:var(--c);display:flex;gap:7px;align-items:center}
.dtxt{display:flex;flex-direction:column;gap:6px;min-width:0}
.lab{font:600 11px/1 var(--f-label);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}

/* sessions list */
details.s{border-top:1px solid var(--line);padding:11px 0}
details.s:first-child{border-top:0;padding-top:0}
details.s summary{cursor:pointer;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:baseline;list-style:none}
details.s summary::-webkit-details-marker{display:none}
details.s .sd{font:600 13px/1.2 var(--f-label);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
details.s .sl{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
details.s[open] .sl{display:block;-webkit-line-clamp:unset}
details.s .tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.tag{font:600 11px/1 var(--f-label);text-transform:uppercase;letter-spacing:.1em;padding:3px 6px;border-radius:2px;background:var(--surface2);color:var(--muted)}

/* person hero */
.phero{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:center}
.phero img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid var(--c)}
.phero h1{font:400 clamp(40px,8vw,72px)/.95 var(--f-display);text-transform:uppercase}
.phero .full{font:600 13px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--c);margin-top:8px}


.pbs{display:flex;flex-direction:column}
.pbmonth{margin:16px 0 6px;color:var(--ink)}
.pbmonth:first-child{margin-top:0}
.pbrow{display:grid;grid-template-columns:58px minmax(150px,230px) 1fr;gap:6px 14px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.pbmonth+.pbrow{border-top:0}
.pbrow:first-child{border-top:0}
.pbd{font:600 13px/1.2 var(--f-label);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.pbm{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pbv{min-width:0;overflow-wrap:anywhere}
.pbv b{font-weight:600}
.pbv .num{font:400 20px/1 var(--f-display);margin-left:4px;letter-spacing:.02em}
.pbv em{display:block;font-style:normal;color:var(--muted);font-size:13px;margin-top:2px}
.chip.pbc{background:rgba(255,255,255,.18);border-color:#fff;color:#fff}
.chip.pbt{background:transparent;border-color:var(--muted);color:#fff}
.pbm .who{font:600 12px/1 var(--f-label);text-transform:uppercase;letter-spacing:.1em;color:var(--c);display:flex;gap:6px;align-items:center;min-width:64px}
@media (max-width:640px){.pbrow{grid-template-columns:52px 1fr}.pbv{grid-column:1 / -1}}
#tip{position:fixed;z-index:50;pointer-events:none;background:#16161a;color:#fff;border:1px solid rgba(255,255,255,.35);padding:7px 10px;border-radius:3px;font:600 13px/1.35 var(--f-body);max-width:260px;opacity:0;transition:opacity .08s;white-space:pre-line}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;gap:6px 24px;flex-wrap:wrap}

@media (max-width:640px){
  .hero{grid-template-columns:96px 1fr;gap:16px}.poster{width:96px}
  .phero{grid-template-columns:96px 1fr;gap:16px}.phero img{width:96px;height:96px}
  .rev{grid-template-columns:1fr}
  .cell{min-height:64px;padding:4px}
  .cl span{display:none}.cl{gap:0}
  .cell .cls{display:flex;gap:4px;flex-wrap:wrap}
  .dline{grid-template-columns:1fr}
  .arow{grid-template-columns:62px 1fr;gap:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

ki na start przy CNFie wyczekiwania dużo i rosło napięcie i pełno myśli. Na linie jak były 2 minuty do OT to Piotrek w ogóle o czymś innym myślał - remont domu - luz totalny\nPiotrek chciał dać 115m ale potem po starcie stwierdził, że dobrze, że nie dał, jakbym dał parę metrów więcej to mógłbym się przekręcić bo bym się zestresował. Dobrze, że dużo w Molchanovkach krótkich pływamy - dużo dobrego to daje na technikę i siłę nóg. I Molchanov i Bourdilla straszna technika i nogi im paliły. Piotrek w ogóle tego nie czuje. Jedyne co się obawiał Piotrek to skurcz - od chodzenia na boso - ale pomogło chodzenie w skarpetach i też skarpety przed startem by stopy nagrzać.","g":["OpenWater","Comp"],"r":0,"a":1},{"d":"2026-08-26","w":"d","t":"POOL DYN: pianka Orca, lobster M+ 1,5kg + 3kg na pasie 60 paków\n1. DNF - 150m \n2. DYNB - 150m \n3. Bottom Crawl 04:02min","g":["DYN"],"r":0,"a":1},{"d":"2026-08-26","w":"k","t":"POOL DYN: \n1.⁠ ⁠WUp 4x 25m DYNB\n2.⁠ ⁠DYNB 75m + nawrót\n3.⁠ 50m DYNB \n4.⁠ ⁠10x 25m DYNB - start 01:15-20","g":["DYN"],"r":0,"a":1},{"d":"2026-08-28","w":"d","t":"Deepspot with Emilia \nCNF 44m powrót 2:15\nCNF/FIM 44m no hang\nFRC MF 30,6m\nFRC MF 30,8m\nRV MF 20,0m hit the floor 🥹\nRV MF 31,1m  PB! 🥳🥳🥳\nRV MF 27,6m","g":["DeepSpot"],"r":0,"a":1},{"d":"2026-08-30","w":"d","t":"OpenWater Cypr - Trening 1\n1) 15m buoyancy check.\n2) ⁠40m FIM, 2kg neck, 1,5mm OC, no goggles\n3) 40m CNF, (ET from 50m), 2kg neck, 1,5mm OC, no goggles\n4) 56m FIM, (ET from 80m) 1,6kg neck, 2kg belt, 1,5mm OC, no goggles, 6 HV. \n\nReflections:\n•⁠  ⁠1,5mm is great, warm enough for many dives\n•⁠  ⁠reconfig alarms\n•⁠  ⁠⁠termocline is a 20m. Take mouthfill before and topup after. \n•⁠  ⁠try 10 HV\n•⁠  ⁠⁠FIM weight, do 2+2kg next\n•⁠  ⁠⁠putting goggles back on 🤓","g":["OpenWater"],"r":0,"a":1},{"d":"2026-08-31","w":"d","t":"OpenWater Cypr - Trening 2\n1.⁠ ⁠40m FIM, 1,6kg neck, 2kg belt, 1,5mm OC, goggles\n2.⁠ ⁠40m FIM,\n3.⁠ ⁠52m FIM,\n4.⁠ ⁠79m FIM, 10 HV, 60 packs\n\nReflections:\n\n•⁠ function pbRow(p,showWho,cur){

function currentSet(list){const seen=new Set(),cur=new Set();list.slice().sort((a,b)=>b.d.localeCompare(a.d)||0).forEach(p=>{const k=p.w+p.t+p.x;if(!seen.has(k)){seen.add(k);cur.add(p)}});return cur}

function pbSection(w){

/* ---------- helpers ---------- */
const ord=n=>n+(n%100>=11&&n%100<=13?'th':n%10===1?'st':n%10===2?'nd':n%10===3?'rd':'th');
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const U=iso=>new Date(iso+'T00:00:00Z');
const iso=dt=>dt.toISOString().slice(0,10);
const addD=(i,n)=>iso(new Date(U(i).getTime()+n*864e5));
const fmt=(i,o={day:'numeric',month:'short'})=>U(i).toLocaleDateString('en-GB',{...o,timeZone:'UTC'});
const dow=i=>(U(i).getUTCDay()+6)%7;
const trained=D.sessions.filter(s=>s.a&&s.d<=SNAP);
const restd=D.sessions.filter(s=>s.r&&s.d<=SNAP);
const byWho=w=>trained.filter(s=>s.w===w);
const logOn=(w,d)=>D.sessions.find(s=>s.w===w&&s.d===d);
const planOn=(w,d)=>D.plans.filter(p=>p.w===w&&p.d===d);
const evOn=d=>D.events.filter(e=>e.d===d);
function timeOf(t){const m=t.match(/(?:^|[^\d.:])(\d{1,2})(?:[:.](\d{2}))?\s*[-–]\s*\d/);return m?String(m[1]).padStart(2,'0')+':'+(m[2]||'00'):''}
function planLabel(p){const tm=timeOf(p.t);const g=p.g.length?p.g.map(x=>SHORT[x]||x).join('/'):'';return [tm,g].filter(Boolean).join(' ')||p.t.slice(0,14)}
function monthCounts(w){const a=Array(12).fill(0);byWho(w).forEach(s=>a[+s.d.slice(5,7)-1]++);return a}
function discCounts(w){const c={};DISC.forEach(x=>c[x]=0);byWho(w).forEach(s=>s.g.forEach(g=>{if(c[g]!=null)c[g]++}));return c}
function streak(w){const set=new Set(byWho(w).map(s=>s.d));let best=0,cur=0;for(let d='2026-01-01';d<=SNAP;d=addD(d,1)){if(set.has(d)){cur++;best=Math.max(best,cur)}else cur=0}return best}
function hitRate(w){const days=[...new Set(D.plans.filter(p=>p.w===w&&p.a&&p.d<=SNAP).map(p=>p.d))];if(!days.length)return null;const hit=days.filter(d=>trained.some(s=>s.w===w&&s.d===d)).length;return Math.round(100*hit/days.length)}
function last30(w){const from=addD(SNAP,-29);return byWho(w).filter(s=>s.d>=from).length}
function lastSession(w){const a=byWho(w);return a.length?a[a.length-1].d:null}
function medals(w){const m={gold:0,silver:0};RESULTS.forEach(r=>r.items.forEach(i=>{if((!w||i.w===w)&&m[i.k]!=null)m[i.k]++}));return m}

const tip=$('#tip');
function showTip(e,t){tip.textContent=t;tip.style.opacity=1;const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px'}
document.addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t)showTip(e,t.dataset.tip);else tip.style.opacity=0});
document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t)showTip(e,t.dataset.tip);else tip.style.opacity=0});

/* ---------- charts ---------- */
function heatmap(w){
  const start='2025-12-29',cs=11,gp=3,left=0,top=16;
  const weeks=53,W=left+weeks*(cs+gp),H=top+7*(cs+gp);
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Training days in 2026 for ${PEOPLE[w].name}">`;
  let lastM=-1;
  for(let c=0;c<weeks;c++){
    const mon=addD(start,c*7);const m=+addD(mon,3).slice(5,7)-1;const yr=addD(mon,3).slice(0,4);
    if(m!==lastM&&yr==='2026'){s+=`<text x="${left+c*(cs+gp)}" y="10">${MS[m]}</text>`;lastM=m}
    for(let r=0;r<7;r++){
      const d=addD(mon,r*1+0);const dd=addD(mon,r);
      if(dd<'2026-01-01'||dd>'2026-12-31')continue;
      const x=left+c*(cs+gp),y=top+r*(cs+gp);
      const lg=D.sessions.find(q=>q.w===w&&q.d===dd&&(q.a||q.r));const pl=D.plans.some(p=>p.w===w&&p.d===dd&&p.a);
      let fill='var(--surface2)',stroke='none',op=1,t=fmt(dd,{weekday:'short',day:'numeric',month:'short'});
      if(dd>SNAP){fill='transparent';stroke=pl?'var(--c)':'var(--line)';t+=pl?'\nPlanned':''}
      else if(lg&&lg.a){fill='var(--c)';t+='\n'+lg.t.split('\n')[0].slice(0,70)}
      else if(lg&&lg.r){fill='transparent';stroke='var(--muted)';t+='\nRest day'}
      else if(pl){fill='transparent';stroke='var(--c)';op=.45;t+='\nPlanned, no log'}
      s+=`<rect x="${x}" y="${y}" width="${cs}" height="${cs}" rx="2" fill="${fill}" stroke="${stroke}" stroke-width="${stroke==='none'?0:1.5}" opacity="${op}" data-tip="${esc(t)}"/>`;
    }
  }
  return s+'</svg>';
}
function monthChart(whos){
  const W=760,H=250,L=30,B=26,T=10,R=6;const pw=W-L-R,ph=H-T-B;
  const data=whos.map(w=>monthCounts(w));
  const max=Math.max(5,...data.flat());const top=Math.ceil(max/4)*4;
  const gw=pw/12,bw=Math.min(15,(gw-10)/whos.length);
  let s=`<svg width="100%" viewBox="0 0 ${W} ${H}" style="min-width:560px" role="img" aria-label="Sessions per month">`;
  for(let i=0;i<=4;i++){const v=top*i/4,y=T+ph-ph*v/top;s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end">${v}</text>`}
  for(let m=0;m<12;m++){
    const gx=L+m*gw+(gw-bw*whos.length-(whos.length-1)*2)/2;
    s+=`<text x="${L+m*gw+gw/2}" y="${H-8}" text-anchor="middle">${MS[m]}</text>`;
    whos.forEach((w,i)=>{
      const v=data[i][m];if(m>9&&!v)return;const h=ph*v/top;const x=gx+i*(bw+2);
      s+=`<g class="${w}" data-tip="${esc(PEOPLE[w].name+' · '+MONTHS[m]+': '+v+' sessions')}"><rect x="${x}" y="${T}" width="${bw}" height="${ph}" fill="transparent"/>`+
         (v?`<path d="M${x} ${T+ph}V${T+ph-h+3}Q${x} ${T+ph-h} ${x+3} ${T+ph-h}H${x+bw-3}Q${x+bw} ${T+ph-h} ${x+bw} ${T+ph-h+3}V${T+ph}Z" fill="var(--c)"/>`:'')+`</g>`;
    });
  }
  return s+'</svg>';
}
function legend(whos){return `<div class="legend">${whos.map(w=>`<span class="${w}"><i></i>${PEOPLE[w].name}</span>`).join('')}</div>`}
function discBars(w){const c=discCounts(w);const mx=Math.max(1,...Object.values(c));

/* ---------- agenda ---------- */
function agenda(w,days=7){
  const rows=[];
  for(let i=0;i<days;i++){
    const d=addD(SNAP,i);const evs=evOn(d);
    const items=[];
    (w?[w]:ORDER).forEach(x=>{
      const pl=planOn(x,d);const lg=logOn(x,d);
      pl.forEach(p=>items.push({w:x,label:planLabel(p),t:p.t,tm:timeOf(p.t)}));
      if(!pl.length&&lg&&!lg.r&&d>SNAP)items.push({w:x,label:'Workout drafted',t:lg.t.split('\n')[0],tm:''});
    });
    const tms={};items.forEach(it=>{if(it.tm)(tms[it.tm]=tms[it.tm]||new Set()).add(it.w)});
    const buddy=Object.entries(tms).filter(([,s])=>s.size>1).map(([t,s])=>t+' · '+[...s].map(x=>PEOPLE[x].name).join(' + '));
    if(!items.length&&!evs.length)continue;
    rows.push(`<div class="arow"><div class="adate">${fmt(d,{day:'numeric',month:'short'})}<small>${fmt(d,{weekday:'long'})}</small></div><div class="aitems">`+
      evs.map(e=>`<div class="aline"><span class="badge ev">Event</span><span>${esc(e.t)}</span></div>`).join('')+
      items.map(it=>`<div class="aline ${it.w}"><i class="dot"></i><span><b>${w?'':PEOPLE[it.w].name+' · '}${esc(it.label)}</b> <em>${esc(it.t.length>60?it.t.slice(0,60)+'…':it.t)}</em></span></div>`).join('')+
      buddy.map(b=>`<div class="aline"><span class="badge buddy">Buddy match</span><span>${esc(b)}</span></div>`).join('')+
      `</div></div>`);
  }
  return rows.length?`<div class="agenda">${rows.join('')}</div>`:`<p class="empty">Nothing planned in the next ${days} days. Add sessions to the sheet and refresh.</p>`;
}
function upcomingEvents(){
  const ev=D.events.filter(e=>e.d>SNAP).slice(0,6);

function drawCal(){
  $('#calt').textContent=MONTHS[cal.m]+' 2026';
  const first=`2026-${String(cal.m+1).padStart(2,'0')}-01`;const off=dow(first);
  let h=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="dow">${x}</div>`).join('');
  for(let i=0;i<42;i++){
    const d=addD(first,i-off);const inM=+d.slice(5,7)-1===cal.m;
    if(i>=35&&!inM&&i%7===0)break;
    const evs=evOn(d);
    const lines=ORDER.map(w=>{const pl=planOn(w,d);const lg=logOn(w,d);const done=lg&&!lg.r&&d<=SNAP;
      if(!pl.length&&!done)return '';
      const label=pl.length?planLabel(pl[0]):(lg.t.split('\n')[0].slice(0,12));
      return `<div class="cl ${w}"><i class="dot ${done?'on':''}"></i><span>${esc(label)}</span></div>`}).join('');
    h+=`<button class="cell${inM?'':' out'}${d===SNAP?' today':''}${d===cal.sel?' sel':''}${evs.length?' ev':''}" data-d="${d}" aria-label="${fmt(d,{weekday:'long',day:'numeric',month:'long'})}"><div class="dn"><b>${+d.slice(8)}</b></div><div class="cls">${lines}</div></button>`;
  }
  $('#grid').innerHTML=h;
  drawDay();
}
function drawDay(){
  const d=cal.sel;const evs=evOn(d);
  let h=`<h3>${fmt(d,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}${d===SNAP?' · today':''}</h3>`;
  h+=evs.map(e=>`<div class="aline"><span class="badge ev">Event</span><span>${esc(e.t)}</span></div>`).join('');
  h+=ORDER.map(w=>{const pl=planOn(w,d);const lg=logOn(w,d);const P=PEOPLE[w];
    let body='';
    if(pl.length)body+=`<div><div class="lab">Plan</div>${pl.map(p=>`<p class="pre">${esc(p.t)}</p>`).join('')}</div>`;
    if(lg)body+=`<div><div class="lab">${d>SNAP?'Drafted workout':(lg.r?'Rest':'Log')}</div><p class="pre">${esc(lg.t)}</p></div>`;
    if(!body)body='<span class="hint">Nothing in the sheet for this day.</span>';
    return `<div class="dline ${w}"><div class="who"><i class="dot on"></i>${P.name}</div><div class="dtxt">${body}</div></div>`}).join('');
  $('#day').innerHTML=h;
}
function bindCal(){
  $('#prev').onclick=()=>{cal.m=(cal.m+11)%12;drawCal()};
  $('#next').onclick=()=>{cal.m=(cal.m+1)%12;drawCal()};
  $('#tod').onclick=()=>{cal.m=+SNAP.slice(5,7)-1;cal.sel=SNAP;drawCal()};
  $('#grid').onclick=e=>{const c=e.target.closest('.cell');if(!c)return;cal.sel=c.dataset.d;drawCal();$('#day').scrollIntoView({block:'nearest',behavior:'smooth'})};
}

/* ---------- shell ---------- */
const TABS=[{id:'team',label:'Team'},{id:'calendar',label:'Calendar'},{sep:1},
 {id:'piotrek',label:'Piotrek',w:'p'},{id:'kasia',label:'Kasia',w:'k'},{id:'daniel',label:'Daniel',w:'d'}];
function tabsHTML(cur){return '<div class="brand">banda <b>ZŁYCH</b></div>'+TABS.map(t=>t.sep?'<span class="sep"></span>':`<button class="tab" role="tab" data-go="${t.id}" aria-selected="${t.id===cur}">${t.w?`<img src="${PEOPLE[t.w].img}" alt="">`:''}${t.label}</button>`).join('')}
function render(){
  let id=(location.hash||'#team').slice(1);if(!TABS.some(t=>t.id===id))id='team';
  $('#tabs').innerHTML=tabsHTML(id);
  const w={piotrek:'p',kasia:'k',daniel:'d'}[id];
  $('#main').innerHTML=id==='team'?teamView():id==='calendar'?calendarView():personView(w);
  if(id==='calendar'){bindCal();drawCal()}
  const sb=$('#pbsort');if(sb)sb.onclick=()=>{pbDir=pbDir==='asc'?'desc':'asc';sb.textContent=pbDir==='asc'?'Oldest first':'Latest first';$('#pbtl').innerHTML=pbTimeline()};
  scrollTo(0,0);
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(!g)return;const id=g.dataset.go;
  if('#'+id===location.hash||(!location.hash&&id==='team')){render();return}
  try{location.hash=id}catch(_){render()}});
addEventListener('hashchange',render);
$('#foot').textContent='banda ZŁYCH · Warsaw · calendar as of '+fmt(SNAP,{day:'numeric',month:'long',year:'numeric'});
render();
</script>
